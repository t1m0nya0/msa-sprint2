stages:
  - build
  - test
  - deploy
  - tag

variables:
  IMAGE_TAG: latest
  IMAGE_NAME: booking-service

build:
  stage: build
  script:
    - docker build -t ${IMAGE_NAME}:${IMAGE_TAG} booking-service/

test:
  stage: test
  script:
    - docker run -d --name booking-test -p 18080:8080 ${IMAGE_NAME}:${IMAGE_TAG}
    - sleep 3
    - curl -sf http://localhost:18080/ping | grep -q pong
    - curl -sf http://localhost:18080/ready | grep -q ready
    - docker rm -f booking-test

deploy:
  stage: deploy
  script:
    - minikube image load ${IMAGE_NAME}:${IMAGE_TAG}
    - helm upgrade --install booking-service helm/booking-service -f helm/booking-service/values.yaml

tag:
  stage: tag
  script:
    - git tag "release-$(date +%Y%m%d-%H%M%S)"
